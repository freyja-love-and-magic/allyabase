# Planet Nine Path-Based Nginx Configuration — prod-homefront droplet
#
# CHECKED-IN COPY of /etc/nginx/sites-available/default on prod-homefront.
# This file did not exist in the repo until 2026-09-30, which is why prod's
# port map had silently diverged from dev's and from allyabase_setup.sh's
# manifest. Keep the two in step: edit here, then copy up, or the next person
# to compare them will be misled the same way.
#
# server_name is a catch-all and the certificate is states.8as.world, so this
# one server block answers prod.8as.world AND the per-state <state>.8as.world
# bases BizBuz pins installs to.
#
# NOTE: these ports are NOT allyabase_setup.sh's manifest ports. This droplet
# was provisioned from an older, sequential allocation and six services differ
# (continuebee 3000/2999, pref 3001/3002, fount 3002/3006, julia 3006/3000,
# minnie 3009/2525, aretha 3010/7277). Do NOT regenerate this file from
# `allyabase_setup.sh --nginx` — it would repoint half of prod at dead ports.

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name _;  # Catch-all for any domain
    return 301 https://$host$request_uri;
}

# Main HTTPS server with path-based routing
server {
    listen 443 ssl;
    server_name _;  # Replace with your actual domain (e.g., mybase.com)

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/states.8as.world/fullchain.pem;        # Update path to your SSL cert
    ssl_certificate_key /etc/letsencrypt/live/states.8as.world/privkey.pem;  # Update path to your SSL key

    # SSL Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # General proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300;
    proxy_connect_timeout 300;

    # Large file uploads for dolores (video service)
    client_max_body_size 100M;

    # Core Planet Nine Services

    # BDO - Big Dumb Object Storage
    location /bdo/ {
        proxy_pass http://localhost:3003/;
    }

    # Fount - MAGIC Protocol & Nineum
    # WAS 3002, where nothing listens, so /fount/ answered 502. fount.js
    # hardcodes app.listen(3006) with no PORT override, so this can only be
    # fixed here.
    location /fount/ {
        proxy_pass http://localhost:3006/;
    }

    # Addie - Payment Processing
    location /addie/ {
        proxy_pass http://localhost:3005/;
    }

    # Sanora - Product Hosting
    location /sanora/ {
        proxy_pass http://localhost:7243/;
    }

    # Dolores - Social Feeds & Media
    location /dolores/ {
        proxy_pass http://localhost:3007/;
    }

    # Covenant removed 2026-09-30. It was routed to 3011 with no process
    # behind it, so /covenant/ answered 502 while /services advertised it.

    # Additional Services

    # Pref - Preferences Storage
    # WAS 3001, where nothing listens.
    location /pref/ {
        proxy_pass http://localhost:3002/;
    }

    # Continuebee - State Verification
    # WAS 3000 — which is JULIA's port. This did not 502, it silently proxied
    # every /continuebee/ request to julia and returned julia's answers. dev
    # hit exactly this and fixed it the same way.
    location /continuebee/ {
        proxy_pass http://localhost:2999/;
    }

    # Joan - Account Recovery
    location /joan/ {
        proxy_pass http://localhost:3004/;
    }

    # Julia - P2P Messaging
    # WAS 3006 — which is FOUNT's port, and the same silent misroute in the
    # opposite direction. Proven on 2026-09-30: prod.8as.world/julia/api/ping
    # returned 200 with fount's ping body, and /api/ping is a fount route
    # julia does not have.
    location /julia/ {
        proxy_pass http://localhost:3000/;
    }

    # Minnie - Email Handling
    # WAS 3009, where nothing listens (minnie's own default is 2525).
    location /minnie/ {
        proxy_pass http://localhost:2525/;
    }

    # Aretha - Limited-Run Products
    # WAS 3010, where nothing listens (aretha's own default is 7277).
    location /aretha/ {
        proxy_pass http://localhost:7277/;
    }

    # Prof - Profile Management
    location /prof/ {
        proxy_pass http://localhost:3008/;
    }

    location /savage/ {
      proxy_pass http://localhost:3012/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Prefix /savage;
  }

    # Eumachia - interactive pay page for BDO-backed invoices
    #
    # The process has been running under pm2 since before this block existed;
    # it was simply never routed, so /eumachia/ fell through to the catch-all
    # 404 and getpayed's prod "Pay Now" links had nowhere to land.
    #
    # No X-Forwarded-Prefix here, unlike savage: eumachia takes the mount
    # point from PUBLIC_PREFIX in its own environment, which defaults to
    # /eumachia. The trailing slash on proxy_pass strips /eumachia before
    # Express sees the request, so if PUBLIC_PREFIX is ever set to anything
    # else the pay button 404s on click.
    location /eumachia/ {
        proxy_pass http://localhost:3013/;
    }

    # Base Discovery & Health Check Endpoints

    # Base announcement endpoint for network discovery
    location /network/ {
        proxy_pass http://localhost:3003/;  # Route to BDO for base registry
    }

    # Health check endpoint
    location /health {
        proxy_pass http://localhost:3003/health;
    }

    # Service discovery endpoint - lists all available services
    #
    # Hand-maintained, and it had drifted from reality on three counts before
    # 2026-09-30: it advertised covenant (dead), and omitted savage and
    # eumachia (both live). Anything reading this to decide what a base can do
    # was being told the wrong thing. Update it in the same commit as a
    # location block, every time.
    location /services {
        default_type application/json;
        return 200 '{
            "base": "$host",
            "services": [
                {"name": "bdo", "path": "/bdo/", "port": 3003, "description": "Big Dumb Object Storage"},
                {"name": "fount", "path": "/fount/", "port": 3006, "description": "MAGIC Protocol & Nineum"},
                {"name": "addie", "path": "/addie/", "port": 3005, "description": "Payment Processing"},
                {"name": "sanora", "path": "/sanora/", "port": 7243, "description": "Product Hosting"},
                {"name": "dolores", "path": "/dolores/", "port": 3007, "description": "Social Feeds & Media"},
                {"name": "savage", "path": "/savage/", "port": 3012, "description": "Shareable SVG pages for published BDOs"},
                {"name": "eumachia", "path": "/eumachia/", "port": 3013, "description": "Interactive pay page for BDO-backed invoices"},
                {"name": "pref", "path": "/pref/", "port": 3002, "description": "Preferences Storage"},
                {"name": "continuebee", "path": "/continuebee/", "port": 2999, "description": "State Verification"},
                {"name": "joan", "path": "/joan/", "port": 3004, "description": "Account Recovery"},
                {"name": "julia", "path": "/julia/", "port": 3000, "description": "P2P Messaging"},
                {"name": "minnie", "path": "/minnie/", "port": 2525, "description": "Email Handling"},
                {"name": "aretha", "path": "/aretha/", "port": 7277, "description": "Limited-Run Products"},
                {"name": "prof", "path": "/prof/", "port": 3008, "description": "Profile Management"}
            ],
            "timestamp": "$time_iso8601"
        }';
    }

    # Root endpoint - base information
    location = / {
        default_type application/json;
        return 200 '{
            "base": "$host",
            "name": "Planet Nine Base",
            "version": "1.0.0",
            "endpoints": {
                "services": "/services",
                "health": "/health",
                "network": "/network/"
            },
            "timestamp": "$time_iso8601"
        }';
    }

    # Optional: Catch-all for undefined paths
    location / {
        default_type application/json;
        return 404 '{
            "error": "Service not found",
            "available_services": "/services",
            "timestamp": "$time_iso8601"
        }';
    }
}
