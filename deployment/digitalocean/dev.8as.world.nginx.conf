# Planet Nine Path-Based Nginx Configuration — dev.8as.world
# Routes all services through a single domain with path-based routing
# Example: https://dev.8as.world/bdo/, https://dev.8as.world/sanora/, etc.
#
# PORTS: every proxy_pass below matches the service's own default, as listed by
#   deployment/allyabase_setup.sh --list
# Regenerate the location blocks rather than editing them by hand:
#   ./allyabase_setup.sh --nginx
# A port that disagrees with the manifest doesn't always fail loudly — it can
# quietly proxy one service's path to a different service that happens to be on
# that port. See the note above /continuebee/ below.

# HTTP -> HTTPS redirect (ACME challenges still served over HTTP for renewals)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name dev.8as.world;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS server with path-based routing
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server ipv6only=on;
    server_name dev.8as.world;

    # SSL (Let's Encrypt / Certbot)
    # options-ssl-nginx.conf already sets protocols, ciphers, session cache —
    # don't redeclare those here or nginx will fail with "duplicate directive".
    ssl_certificate /etc/letsencrypt/live/dev.8as.world/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.8as.world/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # General proxy settings
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300;
    proxy_connect_timeout 300;

    # Large file uploads for dolores (video service)
    client_max_body_size 100M;

    # Core Planet Nine Services

    # BDO - Big Dumb Object Storage
    location /bdo/ {
        proxy_pass http://localhost:3003/;
    }

    # Fount - MAGIC Protocol & Nineum
    # WAS 3002 (nothing listens there; /fount/ returned 502)
    location /fount/ {
        proxy_pass http://localhost:3006/;
    }

    # Addie - Payment Processing
    location /addie/ {
        proxy_pass http://localhost:3005/;
    }

    # Sanora - Product Hosting
    location /sanora/ {
        proxy_pass http://localhost:7243/;
    }

    # Dolores - Social Feeds & Media
    location /dolores/ {
        proxy_pass http://localhost:3007/;
    }

    # Covenant - Contract Management
    # Not part of allyabase_setup.sh's manifest and not currently deployed;
    # this returns 502 until something is listening on 3011.
    location /covenant/ {
        proxy_pass http://localhost:3011/;
    }

    # Savage - renders a published BDO's svg as a shareable webpage
    #
    # X-Forwarded-Prefix is required, not optional. proxy_pass with a trailing
    # slash strips /savage before savage sees the request, and savage builds
    # absolute URLs back to itself for og:image and the "Save Contact" link.
    # Without this header the page renders but both of those 404.
    #
    # The other four headers are repeated here deliberately. nginx inherits
    # proxy_set_header from the server block ONLY when a location declares
    # none of its own — so adding X-Forwarded-Prefix alone silently dropped
    # Host/X-Real-IP/X-Forwarded-For/X-Forwarded-Proto for this one route.
    # savage then fell back to nginx's default Host ($proxy_host) and emitted
    # og:image="http://localhost:3012/savage/..." — a URL no client can reach,
    # in a page that otherwise looked completely fine.
    location /savage/ {
        proxy_pass http://localhost:3012/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /savage;
    }

    # Eumachia - interactive Stripe pay page for a BDO-backed invoice
    # Takes its prefix from PUBLIC_PREFIX in its own env, so no extra header.
    location /eumachia/ {
        proxy_pass http://localhost:3013/;
    }

    # Additional Services

    # Pref - Preferences Storage
    # WAS 3001 (nothing listens there; 3002 is pref's own default)
    location /pref/ {
        proxy_pass http://localhost:3002/;
    }

    # Continuebee - State Verification
    # WAS 3000 — which is JULIA's port. This didn't 502, it silently proxied
    # every /continuebee/ request to julia and returned julia's answers.
    location /continuebee/ {
        proxy_pass http://localhost:2999/;
    }

    # Joan - Account Recovery
    location /joan/ {
        proxy_pass http://localhost:3004/;
    }

    # Julia - P2P Messaging
    # WAS 3006 — which is FOUNT's port. Same silent-misroute problem as
    # continuebee above, in the opposite direction.
    location /julia/ {
        proxy_pass http://localhost:3000/;
    }

    # Minnie - Email Handling
    # WAS 3009 (minnie's own default is 2525; 3009 is unused here)
    location /minnie/ {
        proxy_pass http://localhost:2525/;
    }

    # Aretha - Limited-Run Products
    # WAS 3010 (aretha's own default is 7277)
    location /aretha/ {
        proxy_pass http://localhost:7277/;
    }

    # Prof - Profile Management
    # Optional and off by default in the docker/pm2 setup, so expect 502
    # unless it was explicitly enabled.
    location /prof/ {
        proxy_pass http://localhost:3008/;
    }

    # Base Discovery & Health Check Endpoints

    # Base announcement endpoint for network discovery
    location /network/ {
        proxy_pass http://localhost:3003/;  # Route to BDO for base registry
    }

    # Health check endpoint
    location /health {
        proxy_pass http://localhost:3003/health;
    }

    # Service discovery endpoint - lists all available services
    location /services {
        default_type application/json;
        return 200 '{
            "base": "$host",
            "services": [
                {"name": "bdo", "path": "/bdo/", "port": 3003, "description": "Big Dumb Object Storage"},
                {"name": "fount", "path": "/fount/", "port": 3006, "description": "MAGIC Protocol & Nineum"},
                {"name": "addie", "path": "/addie/", "port": 3005, "description": "Payment Processing"},
                {"name": "sanora", "path": "/sanora/", "port": 7243, "description": "Product Hosting"},
                {"name": "dolores", "path": "/dolores/", "port": 3007, "description": "Social Feeds & Media"},
                {"name": "covenant", "path": "/covenant/", "port": 3011, "description": "Contract Management"},
                {"name": "savage", "path": "/savage/", "port": 3012, "description": "Shareable SVG pages for published BDOs"},
                {"name": "eumachia", "path": "/eumachia/", "port": 3013, "description": "Interactive pay page for BDO-backed invoices"},
                {"name": "pref", "path": "/pref/", "port": 3002, "description": "Preferences Storage"},
                {"name": "continuebee", "path": "/continuebee/", "port": 2999, "description": "State Verification"},
                {"name": "joan", "path": "/joan/", "port": 3004, "description": "Account Recovery"},
                {"name": "julia", "path": "/julia/", "port": 3000, "description": "P2P Messaging"},
                {"name": "minnie", "path": "/minnie/", "port": 2525, "description": "Email Handling"},
                {"name": "aretha", "path": "/aretha/", "port": 7277, "description": "Limited-Run Products"},
                {"name": "prof", "path": "/prof/", "port": 3008, "description": "Profile Management"}
            ],
            "timestamp": "$time_iso8601"
        }';
    }

    # Root endpoint - base information
    location = / {
        default_type application/json;
        return 200 '{
            "base": "$host",
            "name": "Planet Nine Base",
            "version": "1.0.0",
            "endpoints": {
                "services": "/services",
                "health": "/health",
                "network": "/network/"
            },
            "timestamp": "$time_iso8601"
        }';
    }

    # Catch-all for undefined paths
    location / {
        default_type application/json;
        return 404 '{
            "error": "Service not found",
            "available_services": "/services",
            "timestamp": "$time_iso8601"
        }';
    }
}
